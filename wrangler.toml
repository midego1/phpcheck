name = "php-version-check"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "phpcheck.midego.net", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

# WordPress vulnerability feed (Wordfence Intelligence v3) is downloaded once a day by the cron
# trigger and stored in KV, so every request worldwide reads the same copy. Needs the
# WORDFENCE_KEY secret (npx wrangler secret put WORDFENCE_KEY).
[[kv_namespaces]]
binding = "VULN_DB"
id = "cbfa17cabfa04d498b995c870d60bcf5"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

# Rate limits, keyed by client IP (Workers Rate Limiting binding). Period is seconds.
[[ratelimits]]
name = "RL_CHECK"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_IMPORT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_MCP"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
